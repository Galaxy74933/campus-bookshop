<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('读者登录 - 网上书城')}"></head>
<body>
<div class="auth-box card">
    <nav th:replace="~{fragments :: breadcrumbs('读者入口', '/reader/entry', '登录')}"></nav>
    <h2>读者登录</h2>
    <p class="sub">使用读者账号登录校园书店</p>
    <div th:replace="~{fragments :: alert}"></div>
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>用户名</label>
            <input type="text" name="username" th:value="${username}" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" name="password" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">登 录</button>
    </form>
    <p class="foot-link">还没有账号？<a th:href="@{/register}">立即注册</a>（注册即送 1000 元购书款）</p>
</div>
</body>
</html>
