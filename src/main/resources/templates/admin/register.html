<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('管理员注册 - 后台管理')}"></head>
<body>
<div class="auth-box card">
    <nav th:replace="~{fragments :: breadcrumbs('管理员入口', '/admin/entry', '注册')}"></nav>
    <h2>管理员注册</h2>
    <p class="sub">创建后台管理员账号</p>
    <div th:replace="~{fragments :: alert}"></div>
    <form th:action="@{/admin/register}" method="post">
        <div class="form-group">
            <label for="username">用户名</label>
            <input id="username" type="text" name="username" th:value="${username}" placeholder="请输入管理员账号" required>
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input id="password" type="password" name="password" placeholder="请输入密码" required>
        </div>
        <div class="form-group">
            <label for="confirmPassword">确认密码</label>
            <input id="confirmPassword" type="password" name="confirmPassword" placeholder="请再次输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">注 册</button>
    </form>
    <p class="foot-link">已有管理员账号？<a th:href="@{/admin/login}">去登录</a></p>
</div>
</body>
</html>
