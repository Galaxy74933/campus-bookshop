<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('管理员登录 - 后台管理')}"></head>
<body>
<div class="auth-box card">
    <nav th:replace="~{fragments :: breadcrumbs('管理员入口', '/admin/entry', '登录')}"></nav>
    <h2>管理员登录</h2>
    <p class="sub">使用管理员账号登录后台管理系统</p>
    <div th:replace="~{fragments :: alert}"></div>
    <form th:action="@{/admin/login}" method="post">
        <div class="form-group">
            <label>用户名</label>
            <input type="text" name="username" th:value="${username}" placeholder="请输入管理员账号" required>
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" name="password" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">登 录</button>
    </form>
    <p class="foot-link">还没有账号？<a th:href="@{/admin/register}">注册管理员</a></p>
</div>
</body>
</html>
