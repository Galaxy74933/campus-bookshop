<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('图书浏览 - 网上书城')}"></head>
<body>
<nav th:replace="~{fragments :: shopNav('books')}"></nav>
<div class="container">
    <div th:replace="~{fragments :: alert}"></div>

    <div class="toolbar">
        <form th:action="@{/shop/books}" method="get" class="search-form">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="按书名关键字搜索">
            <button type="submit" class="btn btn-primary">搜 索</button>
            <a th:if="${keyword}" th:href="@{/shop/books}">清除条件</a>
        </form>
        <a th:href="@{/shop/cart}" class="btn">查看购物车 →</a>
    </div>

    <div class="card">
        <table class="list">
            <thead>
            <tr>
                <th>序号</th>
                <th>书名</th>
                <th>作者</th>
                <th>单价（元）</th>
                <th>库存</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b, row : ${pageResult.records}">
                <td th:text="${(pageResult.page - 1) * pageResult.size + row.count}"></td>
                <td th:text="${b.title}"></td>
                <td th:text="${b.author}"></td>
                <td th:text="${#numbers.formatDecimal(b.price, 1, 2)}"></td>
                <td>
                    <span class="badge" th:classappend="${b.stock > 0} ? 'badge-ok' : 'badge-danger'"
                          th:text="${b.stock > 0} ? '剩 ' + ${b.stock} + ' 本' : '无货'"></span>
                </td>
                <td>
                    <form th:action="@{/shop/cart/add}" method="post" class="inline-form">
                        <input type="hidden" name="bookId" th:value="${b.id}">
                        <input type="number" name="quantity" value="1" min="1" th:max="${b.stock}"
                               class="qty-input" th:disabled="${b.stock <= 0}" title="购买数量">
                        <button type="submit" class="btn btn-sm btn-primary" th:disabled="${b.stock <= 0}"
                                th:text="${b.stock > 0} ? '加入购物车' : '暂时无货'"></button>
                    </form>
                </td>
            </tr>
            <tr th:if="${pageResult.records.isEmpty()}">
                <td colspan="6" class="empty">没有找到相关图书</td>
            </tr>
            </tbody>
        </table>

        <div class="pager" th:if="${pageResult.totalPages > 1}">
            共 <span th:text="${pageResult.total}"></span> 本 ·
            第 <span th:text="${pageResult.page}"></span> / <span th:text="${pageResult.totalPages}"></span> 页
            <a th:if="${pageResult.page > 1}"
               th:href="@{/shop/books(page=${pageResult.page - 1}, keyword=${keyword})}">上一页</a>
            <a th:if="${pageResult.page < pageResult.totalPages}"
               th:href="@{/shop/books(page=${pageResult.page + 1}, keyword=${keyword})}">下一页</a>
        </div>
    </div>
</div>
</body>
</html>
