<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('图书管理 - 后台')}"></head>
<body>
<nav th:replace="~{fragments :: adminNav('books')}"></nav>
<div class="container">
    <div th:replace="~{fragments :: alert}"></div>

    <div class="toolbar">
        <form th:action="@{/admin/books}" method="get" class="search-form">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="按书名关键字查询">
            <button type="submit" class="btn btn-primary">查 询</button>
            <a th:if="${keyword}" th:href="@{/admin/books}">清除条件</a>
        </form>
        <a th:href="@{/admin/books/add}" class="btn btn-success">+ 新增图书</a>
    </div>

    <div class="card">
        <nav th:replace="~{fragments :: adminBreadcrumbs('图书管理', '/admin/books', null)}"></nav>
        <table class="list">
            <thead>
            <tr>
                <th>序号</th>
                <th>书名</th>
                <th>作者</th>
                <th>关联课程</th>
                <th>单价（元）</th>
                <th>库存</th>
                <th>创建时间</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b, row : ${pageResult.records}">
                <td th:text="${(pageResult.page - 1) * pageResult.size + row.count}"></td>
                <td th:text="${b.title}"></td>
                <td th:text="${b.author}"></td>
                <td>
                    <span th:if="${bookCourses[b.id].isEmpty()}" class="form-help">暂未关联</span>
                    <span th:each="c, s : ${bookCourses[b.id]}" th:text="${c.name + (s.last ? '' : '、')}"></span>
                </td>
                <td th:text="${#numbers.formatDecimal(b.price, 1, 2)}"></td>
                <td>
                    <span class="badge" th:classappend="${b.stock > 0} ? 'badge-ok' : 'badge-danger'"
                          th:text="${b.stock}"></span>
                </td>
                <td th:text="${#temporals.format(b.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                <td>
                    <a class="btn btn-sm" th:href="@{/admin/books/{id}/edit(id=${b.id})}">编辑</a>
                    <form th:action="@{/admin/books/{id}/delete(id=${b.id})}" method="post" class="inline-form"
                          onsubmit="return confirm('确定删除该书吗？')">
                        <button type="submit" class="btn btn-sm btn-danger">删除</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${pageResult.records.isEmpty()}">
                <td colspan="8" class="empty">暂无图书，点击右上角「新增图书」创建</td>
            </tr>
            </tbody>
        </table>

        <div class="pager" th:if="${pageResult.totalPages > 1}">
            共 <span th:text="${pageResult.total}"></span> 本 ·
            第 <span th:text="${pageResult.page}"></span> / <span th:text="${pageResult.totalPages}"></span> 页
            <a th:if="${pageResult.page > 1}"
               th:href="@{/admin/books(page=${pageResult.page - 1}, keyword=${keyword})}">上一页</a>
            <a th:if="${pageResult.page < pageResult.totalPages}"
               th:href="@{/admin/books(page=${pageResult.page + 1}, keyword=${keyword})}">下一页</a>
        </div>
    </div>
</div>
</body>
</html>
