<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('专业管理 - 后台')}"></head>
<body>
<nav th:replace="~{fragments :: adminNav('majors')}"></nav>
<div class="container">
    <div class="card">
        <nav th:replace="~{fragments :: adminBreadcrumbs('专业管理', '/admin/majors', null)}"></nav>
        <h2>专业管理</h2>
        <p class="form-help">先建立专业，再到课程管理中选择课程所属的专业。</p>
        <div th:replace="~{fragments :: alert}"></div>
        <div class="toolbar"><a class="btn btn-success" th:href="@{/admin/majors/add}">+ 新增专业</a></div>
        <table class="list">
            <thead><tr><th>ID</th><th>专业名称</th><th>操作</th></tr></thead>
            <tbody>
            <tr th:each="m : ${majors}">
                <td th:text="${m.id}"></td><td th:text="${m.name}"></td>
                <td>
                    <a class="btn btn-sm" th:href="@{/admin/majors/{id}/edit(id=${m.id})}">编辑</a>
                    <form class="inline-form" method="post" th:action="@{/admin/majors/{id}/delete(id=${m.id})}" onsubmit="return confirm('确定删除该专业吗？已关联课程的专业不能删除。')">
                        <button class="btn btn-sm btn-danger" type="submit">删除</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${majors.isEmpty()}"><td colspan="3" class="empty">暂无专业，请先新增专业，例如“软件工程”。</td></tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
