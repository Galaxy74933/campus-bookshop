<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${isEdit} ? '编辑图书 - 后台' : '新增图书 - 后台')}"></head>
<body>
<nav th:replace="~{fragments :: adminNav('books')}"></nav>
<div class="container">
    <div class="card" style="max-width: 520px; margin: 24px auto;">
        <h3 th:text="${isEdit} ? '编辑图书' : '新增图书'"></h3>
        <div th:replace="~{fragments :: alert}"></div>
        <form th:action="${isEdit} ? @{/admin/books/{id}(id=${bookForm.id})} : @{/admin/books}"
              method="post" th:object="${bookForm}">
            <div class="form-group">
                <label>书名 *</label>
                <input type="text" th:field="*{title}" placeholder="请输入书名">
            </div>
            <div class="form-group">
                <label>作者</label>
                <input type="text" th:field="*{author}" placeholder="请输入作者（选填）">
            </div>
            <div class="form-group">
                <label>单价（元）*</label>
                <input type="number" th:field="*{price}" step="0.01" min="0.01" placeholder="如 59.90">
            </div>
            <div class="form-group">
                <label>库存数量 *</label>
                <input type="number" th:field="*{stock}" min="0" step="1" placeholder="请输入库存数量">
            </div>
            <button type="submit" class="btn btn-primary" th:text="${isEdit} ? '保存修改' : '创建图书'"></button>
            <a class="btn" th:href="@{/admin/books}">返回列表</a>
        </form>
    </div>
</div>
</body>
</html>
