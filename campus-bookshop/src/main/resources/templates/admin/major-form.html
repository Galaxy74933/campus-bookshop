<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${majorForm.id == null} ? '新增专业 - 后台' : '编辑专业 - 后台')}"></head>
<body>
<nav th:replace="~{fragments :: adminNav('majors')}"></nav>
<div class="container">
    <div class="card academic-form">
        <nav th:replace="~{fragments :: adminBreadcrumbs('专业管理', '/admin/majors', ${majorForm.id == null} ? '新增专业' : '编辑专业')}"></nav>
        <h2 th:text="${majorForm.id == null} ? '新增专业' : '编辑专业'"></h2>
        <div th:replace="~{fragments :: alert}"></div>
        <form method="post" th:object="${majorForm}" th:action="${majorForm.id == null} ? @{/admin/majors} : @{/admin/majors/{id}(id=${majorForm.id})}">
            <div class="form-group">
                <label for="name">专业名称 *</label>
                <input type="text" th:field="*{name}" maxlength="100" required placeholder="例如：软件工程">
            </div>
            <button type="submit" class="btn btn-primary">保存专业</button>
        </form>
    </div>
</div>
</body>
</html>
