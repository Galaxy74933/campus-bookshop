<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('专业课程总览 - 后台')}"></head>
<body>
<nav th:replace="~{fragments :: adminNav('overview')}"></nav>
<div class="container academic-overview">
    <div class="card">
        <nav th:replace="~{fragments :: adminBreadcrumbs('专业课程总览', '/admin/academic-overview', null)}"></nav>
        <h2>专业课程总览</h2>
        <p class="form-help">按专业查看完整课程关系；同一门共享课程会在它所属的各专业下分别展示。</p>
        <p class="overview-summary">全库共 <strong th:text="${majorCount}"></strong> 个专业，
            <strong th:text="${courseCount}"></strong> 门课程（课程去重计数）。</p>
        <div class="toolbar">
            <form th:action="@{/admin/academic-overview}" method="get" class="search-form">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="搜索专业名称或课程名称" aria-label="专业或课程名称">
                <button type="submit" class="btn btn-primary">查询</button>
                <a th:if="${!keyword.isEmpty()}" th:href="@{/admin/academic-overview}">清除条件</a>
            </form>
            <div class="overview-actions">
                <a class="btn" th:href="@{/admin/majors}">管理专业</a>
                <a class="btn" th:href="@{/admin/courses}">管理课程及关联</a>
            </div>
        </div>
        <p class="form-help overview-search-note">搜索后保留命中专业的全部课程；未关联专业的课程按课程名称匹配。</p>
        <p th:if="${!keyword.isEmpty()}" class="form-help">当前匹配 <strong th:text="${majors.size()}"></strong> 个专业、
            <strong th:text="${unassignedCourses.size()}"></strong> 门未关联专业的课程。</p>
        <div class="overview-table-wrap">
            <table class="list overview-table">
                <caption>专业与课程对应表</caption>
                <thead><tr><th scope="col">序号</th><th scope="col">专业名称</th><th scope="col">课程数</th><th scope="col">课程名称</th><th scope="col">操作</th></tr></thead>
                <tbody th:each="m, group : ${majors}" th:with="courses=${majorCourses[m.id]}" class="overview-group">
                <tr th:if="${courses.isEmpty()}">
                    <td th:text="${group.count}"></td>
                    <th scope="rowgroup" class="overview-major" th:text="${m.name}"></th>
                    <td>0</td><td class="form-help">暂未关联课程</td>
                    <td><a class="btn btn-sm" th:href="@{/admin/courses}">去关联课程</a></td>
                </tr>
                <tr th:each="c, row : ${courses}">
                    <td th:if="${row.first}" th:rowspan="${courses.size()}" th:text="${group.count}"></td>
                    <th th:if="${row.first}" th:rowspan="${courses.size()}" scope="rowgroup" class="overview-major" th:text="${m.name}"></th>
                    <td th:if="${row.first}" th:rowspan="${courses.size()}" th:text="${courses.size()}"></td>
                    <td>
                        <span th:text="${c.name}"></span>
                        <span th:if="${c.majors.size() > 1}" class="badge overview-shared" th:text="${'共享 · ' + c.majors.size() + '个专业'}"></span>
                    </td>
                    <td><a class="btn btn-sm" th:href="@{/admin/courses/{id}/edit(id=${c.id})}">编辑课程及关联</a></td>
                </tr>
                </tbody>
                <tbody th:if="${majors.isEmpty()}"><tr><td colspan="5" class="empty"
                    th:text="${keyword.isEmpty()} ? '暂无专业，可前往专业管理新增。' : '没有匹配的专业，请调整关键词或清除条件。'"></td></tr></tbody>
            </table>
        </div>
        <section class="overview-unassigned" aria-labelledby="unassigned-heading">
            <h3 id="unassigned-heading">未关联专业的课程</h3>
            <p class="form-help">这些课程尚未归入任何专业，可通过“编辑课程及关联”补充所属专业。</p>
            <div class="overview-table-wrap">
                <table class="list">
                    <thead><tr><th scope="col">序号</th><th scope="col">课程名称</th><th scope="col">操作</th></tr></thead>
                    <tbody>
                    <tr th:each="c, row : ${unassignedCourses}">
                        <td th:text="${row.count}"></td><td th:text="${c.name}"></td>
                        <td><a class="btn btn-sm" th:href="@{/admin/courses/{id}/edit(id=${c.id})}">编辑课程及关联</a></td>
                    </tr>
                    <tr th:if="${unassignedCourses.isEmpty()}"><td colspan="3" class="empty"
                        th:text="${keyword.isEmpty()} ? '暂无未关联专业的课程。' : '没有匹配的未关联专业课程。'"></td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</div>
</body>
</html>
