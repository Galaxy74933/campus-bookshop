<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('书单详情 - 校园学习书店')}"></head><body>
<th:block th:if="${admin}"><nav th:replace="~{fragments :: adminNav('reading')}"></nav></th:block>
<th:block th:unless="${admin}"><nav th:replace="~{fragments :: shopNav('reading')}"></nav></th:block>
<div class="container"><div class="card">
<th:block th:if="${admin}"><nav th:replace="~{fragments :: adminBreadcrumbs('书单管理',${base},'书单详情')}"></nav></th:block>
<th:block th:unless="${admin}"><nav th:replace="~{fragments :: readerBreadcrumbs('学习书单',${base},'书单详情')}"></nav></th:block>
<div th:replace="~{fragments :: alert}"></div>
<h2 th:text="${readingList.name}"></h2><p class="booklist-description" th:text="${readingList.description}"></p>
<p class="form-help" th:text="${readingList.publicList} ? '公开书单 · 管理员推荐' : '个人书单 · 仅自己可见'"></p>
<div class="toolbar" th:if="${editable}">
<a class="btn" th:href="@{${base + '/' + readingList.id + '/edit'}}">编辑名称及说明</a>
<form th:action="@{${base + '/' + readingList.id + '/delete'}}" method="post" onsubmit="return confirm('确定删除书单吗？资源仍会保留。')"><button class="btn btn-danger">删除书单</button></form>
</div>
<div class="table-scroll"><table class="list"><thead><tr><th>序号</th><th>名称</th><th>作者</th><th>类别</th><th>单价（元）</th><th>库存</th><th>操作</th></tr></thead><tbody>
<tr th:each="b,row : ${books}"><td th:text="${row.count}"></td><td><a th:href="@{${admin ? '/admin/books/' + b.id : '/shop/books/' + b.id}}" th:text="${b.title}"></a></td><td th:text="${b.author}"></td><td th:text="${b.categoryName}"></td><td th:text="${b.purchasable} ? ${#numbers.formatDecimal(b.price,1,2)} : '不售卖'"></td><td th:text="${b.purchasable} ? ${b.stock} : '不适用'"></td>
<td><div class="row-actions">
<span th:unless="${b.purchasable}" class="badge">仅供浏览</span><form th:if="${!admin and b.purchasable}" th:action="@{/shop/cart/add}" method="post"><input type="hidden" name="bookId" th:value="${b.id}"><button class="btn btn-sm btn-primary" th:disabled="${b.stock == 0}" th:text="${b.stock == 0} ? '暂时缺货' : '加入购物车'"></button></form>
<form th:if="${editable}" th:action="@{${base + '/' + readingList.id + '/books/' + b.id + '/remove'}}" method="post"><button class="btn btn-sm">从书单移除</button></form>
<span th:if="${admin and !editable}" class="form-help">只读</span>
</div></td></tr>
<tr th:if="${books.isEmpty()}"><td colspan="7" class="empty">书单暂无资源。</td></tr>
</tbody></table></div>
<section th:if="${editable}"><h3 class="section-title">向书单添加资源</h3>
<form th:action="@{${base + '/' + readingList.id}}" method="get" class="filter-search">
<select name="field" aria-label="搜索范围"><option value="title" th:selected="${q.field == 'title'}">名称</option><option value="author" th:selected="${q.field == 'author'}">作者</option></select>
<input type="text" name="keyword" th:value="${q.keyword}" placeholder="搜索已有资源" aria-label="搜索已有资源"><button class="btn btn-primary">搜索</button><a th:href="@{${base + '/' + readingList.id}}">清除条件</a></form>
<div class="table-scroll"><table class="list"><thead><tr><th>名称</th><th>作者</th><th>类别</th><th>操作</th></tr></thead><tbody>
<tr th:each="b : ${pageResult.records}"><td><a th:href="@{${admin ? '/admin/books/' + b.id : '/shop/books/' + b.id}}" th:text="${b.title}"></a></td><td th:text="${b.author}"></td><td th:text="${b.categoryName}"></td><td>
<form th:action="@{${base + '/' + readingList.id + '/books'}}" method="post"><input type="hidden" name="bookId" th:value="${b.id}"><button class="btn btn-sm">加入此书单</button></form>
</td></tr><tr th:if="${pageResult.records.isEmpty()}"><td colspan="4" class="empty">没有找到资源，请调整关键词。</td></tr>
</tbody></table></div>
<div th:replace="~{catalog/pager :: pager(${base + '/' + readingList.id},${q},${pageResult})}"></div>
</section></div></div></body></html>
